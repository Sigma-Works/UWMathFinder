# Runs the unit tests and the data checks on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (syllabus logic)
        run: npm test
      - name: Validate data files (questions, exams, chapters, syllabus)
        run: npm run validate
      - name: Course pages and sitemap are up to date
        run: |
          npm run build:pages
          git diff --exit-code -- courses sitemap.xml || {
            echo "::error::Course pages are out of date. Run 'npm run build:pages' and commit the result."; exit 1; }
